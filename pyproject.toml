[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fairy-farm"
version = "0.4.1"
description = "Event-based agricultural agent simulation: shared soybean L1 and L3 runtime"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
wofost = ["pcse==6.0.13"]
llm = ["openai>=1.60,<3"]
test = ["pytest>=8"]

[project.scripts]
fairy = "interface.cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["fairy", "evaluate", "interface"]

[tool.pytest.ini_options]
testpaths = ["demo"]
pythonpath = ["."]
